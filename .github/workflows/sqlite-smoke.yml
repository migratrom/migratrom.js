name: SQLite smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      matrix:
        runtime: [bun, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: 22

      - run: bun scripts/sqlite-smoke.mjs
        if: matrix.runtime == 'bun'
      - run: node scripts/sqlite-smoke.mjs
        if: matrix.runtime == 'node'
