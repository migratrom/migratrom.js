name: SQLite smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      matrix:
        runtime: [bun, node, deno]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

      - uses: actions/setup-node@v4
        if: matrix.runtime == 'node'
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x

      - run: bun scripts/sqlite-smoke.mjs
        if: matrix.runtime == 'bun'
      - run: node scripts/sqlite-smoke.mjs
        if: matrix.runtime == 'node'
      - run: deno run --allow-env --allow-ffi --allow-read --allow-write --node-modules-dir=manual --no-lock scripts/sqlite-smoke.mjs
        if: matrix.runtime == 'deno'
